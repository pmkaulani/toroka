services:
  - type: web
    name: toroka
    runtime: docker
    plan: free
    healthCheckPath: /v1/health
    envVars:
      - key: SSI_ENV
        value: prod
      - key: INTELLIGENCE_CACHE_TTL_SECONDS
        value: "900"
      - key: TAVILY_API_KEY
        sync: false
      - key: WEIR_API_KEY
        sync: false
      - key: SCRAPE_CREATORS_API_KEY
        sync: false
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: HMAC_KEY
        generateValue: true
