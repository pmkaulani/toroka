services:
  - type: web
    name: toroka
    runtime: docker
    plan: free
    healthCheckPath: /v1/health
    envVars:
      - key: SSI_ENV
        value: prod
      - key: DATABASE_URL
        value: sqlite:////data/ssi.db
      - key: STORAGE_DIR
        value: /data/evidence
      - key: AI_MODEL
        value: gemini-flash-lite-latest
      - key: GEMINI_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: WEIR_API_KEY
        sync: false
      - key: SCRAPE_CREATORS_API_KEY
        sync: false
      - key: INTELLIGENCE_CACHE_TTL_SECONDS
        value: "900"
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: HMAC_KEY
        generateValue: true
