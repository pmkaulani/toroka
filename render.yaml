services:
  - type: web
    name: toroka
    runtime: docker
    plan: starter # Starter plan required for persistent disk storage on Render
    healthCheckPath: /v1/health
    disk:
      name: toroka-data
      mountPath: /data
      sizeGB: 10
    envVars:
      - key: PORT
        value: "8000"
      - key: WEB_CONCURRENCY
        value: "1"
      - key: SSI_ENV
        value: prod
      - key: TRUST_PROXY_HEADERS
        value: "1"
      - key: TRUSTED_PROXY_HOPS
        value: "1"
      - key: DATABASE_URL
        value: sqlite:////data/ssi.db
      - key: STORAGE_DIR
        value: /data/evidence
      - key: AI_MODEL
        value: gemini-flash-lite-latest
      - key: GEMINI_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: WEIR_API_KEY
        sync: false
      - key: SCRAPE_CREATORS_API_KEY
        sync: false
      - key: INTELLIGENCE_CACHE_TTL_SECONDS
        value: "900"
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: HMAC_KEY
        generateValue: true
