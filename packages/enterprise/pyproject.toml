[project]
name = "toroka-enterprise"
version = "0.1.0"
description = "Evidence-first insider-risk investigation for financial institutions, built on toroka_core"
requires-python = ">=3.12"
dependencies = ["cryptography>=42"]

[project.scripts]
toroka-ent = "toroka_enterprise.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
# toroka_core is found via TOROKA_CORE_PATH or ../smart-scam-identifier/packages/core (see tests/conftest.py)
